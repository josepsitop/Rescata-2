name: Compilar Rescata
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compilar APK
        run: gradle assembleDebug --no-daemon
      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Rescata.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Rescata-APK
          path: Rescata.apk
      - name: Publicar descarga directa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Rescata v1.${{ github.run_number }}
          files: Rescata.apk
